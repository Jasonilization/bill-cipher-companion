name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Swift build (macOS 14+)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: swift build
      - name: Verify release build
        run: swift build -c release
