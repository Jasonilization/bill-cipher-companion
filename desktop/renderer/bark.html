<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; opacity: 0; }
  canvas.shown { opacity: 1; transition: opacity 0.22s linear; }
  canvas.fading { opacity: 0; transition: opacity 0.22s linear; }
</style>
</head>
<body>
<canvas id="bubble"></canvas>
<script src="pixelart.js"></script>
<script src="bark.js"></script>
</body>
</html>
