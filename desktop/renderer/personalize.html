<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Bill Wants to Study Your Apps</title>
<link rel="stylesheet" href="panels.css">
<style>
  body { display: flex; flex-direction: column; padding: 20px; gap: 14px; }
  #head { display: flex; gap: 12px; align-items: center; flex: none; }
  #eye { width: 40px; height: 40px; flex: none; }
  #head h1 { font-size: 17px; }
  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  #apps { flex: 1; min-height: 60px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 6px 10px; }
  .app { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .app .mark { width: 14px; text-align: center; color: var(--muted); }
  .app.done .mark { color: var(--ok); }
  .app .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app .lines { color: var(--muted); font-size: 11.5px; }
  .spacer { flex: 1; }
  .btn.wide { width: 100%; padding: 9px 12px; }
</style>
</head>
<body>
<div id="head">
  <svg id="eye" viewBox="0 0 40 40" aria-hidden="true">
    <polygon points="20,4 37,35 3,35" fill="#fac726" stroke="#121217" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="20" cy="23" rx="7.5" ry="5" fill="#fff" stroke="#121217" stroke-width="1.6"/>
    <rect x="19" y="18.5" width="2" height="9" fill="#121217"/>
  </svg>
  <div>
    <h1>Personalized commentary</h1>
    <p class="muted">Gravity Falls lines, written for your apps</p>
  </div>
</div>
<div id="body"></div>
<script src="personalize.js"></script>
</body>
</html>
