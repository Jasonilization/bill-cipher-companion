<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Bill — Quotes Manager</title>
<link rel="stylesheet" href="panels.css">
<style>
  body { display: flex; flex-direction: column; }
  #toolbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #toolbar .spacer { flex: 1; }
  #main { flex: 1; min-height: 0; display: flex; }
  #pools { width: 300px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--side); }
  .pool { display: flex; align-items: center; gap: 5px; padding: 6px 12px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
  .pool:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
  .pool.active { background: var(--accent); color: var(--accent-ink); }
  .pool .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .pool .total { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 22px; text-align: right; }
  .pool.active .total { color: inherit; }
  #lines { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 18px; }
  #lines h2 { font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .line { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); align-items: baseline; }
  .line .bucket { flex: none; width: 76px; font: 600 10.5px ui-monospace, Consolas, monospace; color: var(--muted); text-transform: uppercase; }
  .line .text { flex: 1; user-select: text; cursor: text; }
  .empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 0 40px; }
  #recent { flex: none; border-top: 1px solid var(--line); padding: 8px 14px; font: 11.5px ui-monospace, Consolas, monospace; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  #recent div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="toolbar">
  <strong id="count"></strong>
  <span class="spacer"></span>
  <button class="btn primary" id="refresh">Refresh Every Quote Now</button>
  <button class="btn" id="showLog">Show Refresh Log…</button>
</div>
<div id="main">
  <div id="pools"></div>
  <div id="lines"><div class="empty">Pick a pool to read every line, where each one came from, and when it's eligible to be said.</div></div>
</div>
<div id="recent"></div>
<script src="quotes.js"></script>
</body>
</html>
